<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>5 Languages</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><h1>5 Languages</h1><p>英・イ・エ・土・日 比較単語帳</p></div><button id="theme">◐</button></header>
<nav><button data-view="learn" class="active">学習</button><button data-view="list">一覧</button><button data-view="quiz">クイズ</button><button data-view="edit">追加</button><button data-view="data">データ</button></nav>
<main>
<section id="learn" class="view active"><div class="toolbar"><select id="category"></select><button id="shuffle">ランダム</button></div><div id="counter"></div><article id="card"></article><div class="actions"><button id="prev">←</button><button id="examples">例文を見る</button><button id="next">→</button></div></section>
<section id="list" class="view"><input id="search" placeholder="単語・意味を検索"><div id="wordList"></div></section>
<section id="quiz" class="view"><div id="quizBox"></div><button id="quizAnswer">答えを見る</button><button id="quizNext">次の問題</button></section>
<section id="edit" class="view"><h2>単語を追加</h2><form id="addForm"></form><button id="addWord">追加する</button></section>
<section id="data" class="view"><h2>OneDrive / ファイル</h2><p>「書き出す」でJSONを保存し、iPhone/Macのファイル保存先としてOneDriveフォルダを選べます。「読み込む」でそのJSONを戻せます。</p><div class="dataBtns"><button id="export">JSONを書き出す</button><label class="fileBtn">JSONを読み込む<input type="file" id="import" accept="application/json"></label><button id="reset">初期データに戻す</button></div><p class="note">GitHubにはアプリ本体だけを置き、追加語や学習データはJSONとして手元で管理できます。</p></section>
</main><script src="words.js"></script><script src="app.js"></script></body></html>
